name: Framework Release Digest

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly, Monday 09:00 UTC (same as dependency-monitor)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    name: Collect release digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch release digests
        run: python3 scripts/framework_digest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
